<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container with subtle neon border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#neonPinkCyan)" stroke-width="6" opacity="0.8" />

  <!-- Background Cards Motif -->
  <g transform="translate(256, 230) rotate(-14) translate(-90, -120)">
    <rect width="180" height="250" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="4" opacity="0.6" />
    <text x="90" y="140" fill="#a5b4fc" font-size="44" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">A♠</text>
  </g>
  <g transform="translate(256, 230) rotate(14) translate(-90, -120)">
    <rect width="180" height="250" rx="16" fill="#2e1065" stroke="#c084fc" stroke-width="4" opacity="0.6" />
    <text x="90" y="140" fill="#e879f9" font-size="44" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">K♥</text>
  </g>

  <!-- Center Glowing Cocktail Glass / Celebration Icon -->
  <g filter="url(#neonGlow)">
    <!-- Glass Rim & Body -->
    <path d="M176 170 L336 170 L266 290 L266 380 L310 380 L310 400 L202 400 L202 380 L246 380 L246 290 Z" 
          fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Liquid -->
    <path d="M190 190 L322 190 L266 280 Z" fill="url(#glassGrad)" />
    <!-- Lime / Fruit Wedge -->
    <circle cx="340" cy="170" r="28" fill="#10b981" stroke="#34d399" stroke-width="4" />
    <path d="M340 142 L340 198 M312 170 L368 170" stroke="#064e3b" stroke-width="2" />
  </g>

  <!-- Central "P" Monogram -->
  <text x="256" y="255" fill="#ffffff" font-size="76" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle" filter="url(#neonGlow)">P</text>

  <!-- Bottom Brand Text -->
  <text x="256" y="465" fill="#f8fafc" font-size="42" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" letter-spacing="4" text-anchor="middle">
    PREVIALO
  </text>
</svg>