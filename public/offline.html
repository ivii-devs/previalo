<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Previalo - Sin Conexión</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000000;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      user-select: none;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #94a3b8;
      max-width: 320px;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 48px;
      padding: 0.75rem 1.5rem;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
    .btn-secondary {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      margin-top: 0.75rem;
    }
    .btn-secondary:active {
      color: #ffffff;
      border-color: #ffffff;
    }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="#000000" stroke="#ffffff" stroke-width="14" />
    <path d="M 136 149 L 376 149 L 266.5 257 L 266.5 347 L 320.5 347 L 320.5 363 L 191.5 363 L 191.5 347 L 245.5 347 L 245.5 257 Z"
          fill="#000000" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </svg>

  <h1>Sin conexión a la red</h1>
  <p>Previalo funciona 100% offline una vez cargado. Comprueba tu conexión a internet para descargar este contenido.</p>

  <button class="btn" onclick="window.location.reload()">Reintentar carga</button>
  <a class="btn btn-secondary" href="/">Volver al inicio</a>
</body>
</html>
